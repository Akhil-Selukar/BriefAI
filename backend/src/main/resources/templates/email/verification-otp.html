<!DOCTYPE html>
<html lang="en">
<body>
<div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #000000; line-height: 1.6;">
    <p>Hi <b>{{name}}</b>,</p>

    <p>Your BriefAI verification code is:</p>

    <span style="font-size: 16px; font-weight: bold; letter-spacing: 4px; color: #000000; background-color:#c2c2c2; padding: 12px 24px; border-radius: 4px; display: inline-block;">
        {{otp}}
    </span>

    <p>
        This code expires in <b>{{expirationMinutes}} minutes</b>.
    </p>

    <p>
        If you did not create a BriefAI account, please ignore this email.
    </p>

    <hr style="border: 0; border-top: 1.5px solid #a2a2a2; margin: 30px 0;">

    <p style="font-size: 14px; margin-top: 20px;">
        Thanks,<br>
        <strong>BriefAI</strong>
    </p>
</div>
</body>
</html>
