spring:
  application:
    name: briefai

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/briefai}
    username: ${DB_USERNAME:briefai_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  ai:
    vectorstore:
      pgvector:
        initialize-schema: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: ${LOG_LEVEL:INFO}

app:
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}