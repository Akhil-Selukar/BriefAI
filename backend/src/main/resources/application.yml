spring:
  application:
    name: briefai

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/briefai}
    username: ${DB_USERNAME:briefai_user}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  ai:
    vectorstore:
      pgvector:
        initialize-schema: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: ${LOG_LEVEL:INFO}

app:
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${RESEND_OTP_COOLDOWN_SEC:60}

  email:
    from: ${MAIL_FROM}

  jwt:
    secret: ${JWT_SECRET_KEY}
    expiration-minutes: 60

  storage:
    local:
      root-directory: ${LOCAL_STORAGE_ROOT:./uploads}

  document:
    max-file-size-bytes: ${MAX_ALLOWED_FILE_SIZE:10485760}
    max-documents-per-user: ${MAX_ALLOWED_FILES_PER_USER:5}
    chunk-size-words: ${WORDS_PER_CHUNK:200}
    chunk-overlap-words: ${CHUNK_OVERLAP_WORDS:40}